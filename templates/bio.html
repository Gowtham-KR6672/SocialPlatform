<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title or company }}</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Outfit:wght@700;800&display=swap">
  <meta name="description" content="{{ page.bio or '' }}">
  <style>
    :root{--theme:{{ page.theme or '#e30010' }};--ink:#2a0f0c;--muted:#7f6b66}
    *{box-sizing:border-box}
    body{margin:0;font-family:"DM Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);min-height:100vh;
      background:linear-gradient(170deg,#fffdf8 0%,#f7f0e4 100%)}
    .wrap{max-width:520px;margin:0 auto;padding:40px 18px 48px;text-align:center}
    .avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 6px 18px rgba(70,20,10,.16);background:#fff}
    .ph{width:96px;height:96px;border-radius:50%;margin:0 auto;background:var(--theme);color:#fff;font-size:34px;font-weight:700;
      display:flex;align-items:center;justify-content:center}
    h1{font-family:"Outfit","DM Sans",sans-serif;font-size:24px;margin:14px 0 6px}
    .bio{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 22px;white-space:pre-wrap}
    .links{display:flex;flex-direction:column;gap:12px}
    .links a{display:block;padding:15px 18px;border-radius:14px;background:#fff;color:var(--ink);text-decoration:none;font-weight:600;
      border:2px solid transparent;box-shadow:0 4px 14px rgba(70,20,10,.08);transition:transform .12s,border-color .12s}
    .links a:hover{transform:translateY(-1px);border-color:var(--theme)}
    .posts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:28px}
    .posts a{display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#efe7da}
    .posts img{width:100%;height:100%;object-fit:cover}
    .foot{margin-top:30px;font-size:12px;color:var(--muted)}
    @media (prefers-reduced-motion: reduce){.links a{transition:none}}
  </style>
</head>
<body>
<main class="wrap">
  {% if page.avatar %}<img class="avatar" src="/uploads/{{ page.avatar }}" alt="">
  {% elif logo %}<img class="avatar" src="/uploads/{{ logo }}" alt="">
  {% else %}<div class="ph">{{ (page.title or company)[:1] }}</div>{% endif %}
  <h1>{{ page.title or company }}</h1>
  {% if page.bio %}<p class="bio">{{ page.bio }}</p>{% endif %}
  <nav class="links">
    {% for l in links %}<a href="/r/{{ l.code }}" rel="noopener">{{ l.label }}</a>{% endfor %}
  </nav>
  {% if posts %}
  <section class="posts" aria-label="Latest posts">
    {% for p in posts %}<a href="{{ p.link or '#' }}" target="_blank" rel="noopener" title="{{ p.title }}"><img src="{{ p.thumb }}" alt="{{ p.title }}" loading="lazy"></a>{% endfor %}
  </section>
  {% endif %}
  <div class="foot">{{ company }}</div>
</main>
</body>
</html>
